<!doctype html>
<html lang="en-US">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>{{ page.title }} | {{ page.title_suffix | default: site.title }}</title>
    {% seo title=false %}
    {% feed_meta %}
    <style>
        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            font-family: sans-serif;
            max-width: 960px;
            margin: 0 auto;
            padding: 24px;
            box-sizing: border-box;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        @media (max-width: 600px) {
            body {
                padding: 16px;
            }
        }

        nav a {
            color: inherit;
        }

        /* Keep lines to a comfortable reading length */
        article {
            max-width: 65ch;
            line-height: 1.6;
        }

        article h1 {
            line-height: 1.2;
            margin-bottom: 8px;
        }

        article>time {
            display: block;
            margin-bottom: 32px;
            opacity: 0.6;
        }

        /* Tall images, like phone screenshots, shrink to fit the screen */
        article img {
            display: block;
            max-width: 100%;
            max-height: 80vh;
            width: auto;
            height: auto;
        }

        /* Videos and embeds fit the column */
        article video,
        article iframe {
            display: block;
            max-width: 100%;
            height: auto;
        }

        article iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: 0;
        }

        /* Code blocks scroll sideways on small screens instead of stretching the page */
        article pre {
            overflow-x: auto;
            padding: 12px 16px;
            border-radius: 6px;
            background: rgba(127, 127, 127, 0.12);
            font-size: 0.85em;
            line-height: 1.45;
        }

        article :not(pre)>code {
            padding: 1px 4px;
            border-radius: 4px;
            background: rgba(127, 127, 127, 0.12);
            font-size: 0.9em;
        }

        footer {
            margin-top: auto;
            padding-top: 48px;
            font-size: 0.8em;
            opacity: 0.6;
        }

        footer a {
            color: inherit;
        }
    </style>
</head>

<body>
    <nav><a href="/#writing">← Max Walts</a></nav>
    <main>
        <article>
            <h1>{{ page.title }}</h1>
            <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
            {{ content }}
        </article>
    </main>
    <footer>
        <a href="/#note">Contact</a> ·
        <a href="https://github.com/maxwalts/mwalts.com/blob/main/{{ page.path }}" target="_blank">View source</a>
    </footer>
    <script data-goatcounter="https://maxwalts.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>

</html>
