<!doctype html>
<html lang="en-US">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <title>Tickets · Max Control</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
        body {
            font-family: sans-serif;
            max-width: 960px;
            margin: 0 auto;
            padding: 24px;
        }

        @media (max-width: 600px) {
            body {
                padding: 16px;
            }
        }

        form input {
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
            font: inherit;
        }

        form button {
            font: inherit;
        }

        #mute {
            position: fixed;
            top: 16px;
            right: 16px;
            font-size: 24px;
            background: none;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <p><a href="https://www.instagram.com/maxcontrol__/" target="_blank">Max Control</a> presents</p>
    <h1>This One's for My Day Ones</h1>
    <p id="intro">Date and venue TBA. Your ticket and the details will come by email</p>
    <form id="ticket-form">
        <p><input type="text" name="name" placeholder="Name" autocomplete="name" required /></p>
        <p><input type="email" name="email" placeholder="Email" autocomplete="email" required /></p>
        <p><input type="tel" name="phone" placeholder="Phone (optional)" autocomplete="tel" /></p>
        <p><button type="submit">Count me in</button></p>
    </form>
    <button id="mute" type="button" aria-label="Mute music">🔊</button>
    <audio id="music" loop preload="auto">
        <source src="/day1s.webm" type="audio/webm" />
        <source src="/day1s.m4a" type="audio/mp4" />
    </audio>
    <script>
        // Browsers block autoplay with sound until the visitor interacts, so retry on the first tap or keypress
        const music = document.getElementById("music");
        music.play().catch(() => {
            const start = () => {
                removeEventListener("pointerdown", start);
                removeEventListener("keydown", start);
                music.play().catch(() => {});
            };
            addEventListener("pointerdown", start);
            addEventListener("keydown", start);
        });

        const mute = document.getElementById("mute");
        mute.onclick = () => {
            music.muted = !music.muted;
            mute.textContent = music.muted ? "🔇" : "🔊";
            mute.ariaLabel = music.muted ? "Unmute music" : "Mute music";
        };

        const SUPABASE_URL = "https://mwuaxxkcfdxouyqigbsi.supabase.co";
        const SUPABASE_KEY = "sb_publishable_PFlCtEFPncOVpNOYfAC3pw_dmHtHPjf";
        const EVENT = "party-tbd";

        const form = document.getElementById("ticket-form");
        form.onsubmit = async e => {
            e.preventDefault();
            form.querySelector("button").disabled = true;
            const res = await fetch(SUPABASE_URL + "/rest/v1/tickets", {
                method: "POST",
                headers: {
                    apikey: SUPABASE_KEY,
                    "Content-Type": "application/json",
                    Prefer: "return=minimal"
                },
                body: JSON.stringify({ event: EVENT, ...Object.fromEntries(new FormData(form)) })
            }).catch(() => null);
            const ok = res && (res.ok || res.status === 409);
            if (ok) document.getElementById("intro").remove();
            form.innerHTML = ok
                ? "<p>You're on the list. See you there</p>"
                : "<p>Something went wrong. Try again later</p>";
        };
    </script>
    <script data-goatcounter="https://maxwalts.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>

</html>
