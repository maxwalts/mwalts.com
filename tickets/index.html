    <style>
        body {
            font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace;
            max-width: 960px;
            margin: 0 auto;
            padding: 24px;
        }

        @media (max-width: 600px) {
            body {
                padding: 16px;
            }
        }

        form button {
            font: inherit;
        }

        form input {
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
            font: inherit;
        }

        #mute {
            position: fixed;
            top: 16px;
            right: 16px;
            font-size: 24px;
            background: none;
            border: none;
            cursor: pointer;
        }
    </style>

<body>
    <p><a href="https://www.instagram.com/maxcontrol__/" target="_blank">Max Control</a> presents</p>
    <h1>Open House 001</h1>
    <p id="intro">House, trance, techno. Date and venue TBA. Your ticket and the details will come by email.</p>
    <form id="ticket-form">
        <p><input type="text" name="name" placeholder="Name" autocomplete="name" required /></p>
        <p><input type="email" name="email" placeholder="Email" autocomplete="email" required /></p>
        <p><input type="text" name="instagram" placeholder="Instagram handle (optional)" autocapitalize="none" autocorrect="off" spellcheck="false" /></p>
        <p><button type="submit">Count me in</button></p>
    </form>
    <button id="mute" type="button" aria-label="Play music">🔇</button>
    <audio id="music" src="/open-house.m4a" loop preload="auto"></audio>
    <script>
        const music = document.getElementById("music");
        const mute = document.getElementById("mute");
        const updateIcon = () => {
            const silent = music.paused || music.muted;
            mute.textContent = silent ? "🔇" : "🔊";
            mute.ariaLabel = silent ? "Play music" : "Mute music";
        };
        music.onplay = music.onpause = music.onvolumechange = updateIcon;

        mute.onclick = () => {
            if (music.paused) music.play().catch(() => {});
            else music.muted = !music.muted;
        };

        // Browsers block autoplay with sound until the visitor interacts. On phones only
        // the end of a tap counts (click, or touchend for taps on blank space in iOS Safari)
        music.play().catch(() => {
            const start = e => {
                if (mute.contains(e.target)) return; // the speaker button handles its own taps
                ["click", "touchend", "keydown"].forEach(t => removeEventListener(t, start));
                music.play().catch(() => {});
            };
            ["click", "touchend", "keydown"].forEach(t => addEventListener(t, start));
        });

        const SUPABASE_URL = "https://mwuaxxkcfdxouyqigbsi.supabase.co";
        const SUPABASE_KEY = "sb_publishable_PFlCtEFPncOVpNOYfAC3pw_dmHtHPjf";
        const EVENT = "party-tbd";

        const form = document.getElementById("ticket-form");
        form.onsubmit = async e => {
            e.preventDefault();
            form.querySelector("button").disabled = true;
            const res = await fetch(SUPABASE_URL + "/rest/v1/tickets", {
                method: "POST",
                headers: {
                    apikey: SUPABASE_KEY,
                    "Content-Type": "application/json",
                    Prefer: "return=minimal"
                },
                body: JSON.stringify({ event: EVENT, ...Object.fromEntries(new FormData(form)) })
            }).catch(() => null);
            const ok = res && (res.ok || res.status === 409);
            if (ok) document.getElementById("intro").remove();
            form.innerHTML = ok
                ? "<p>You're on the list. See you there</p>"
                : "<p>Something went wrong. Try again later</p>";
        };
    </script>
    <script data-goatcounter="https://maxwalts.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
