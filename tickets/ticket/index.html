<!doctype html>
<html lang="en-US">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <title>Your ticket · Max Walts</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
        body {
            font-family: sans-serif;
            max-width: 960px;
            margin: 0 auto;
            padding: 24px;
            text-align: center;
        }

        #qr {
            width: min(320px, 100%);
            margin: 0 auto;
            padding: 16px;
            box-sizing: border-box;
            background: white;
        }

        #qr svg {
            display: block;
            width: 100%;
            height: auto;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
</head>

<body>
    <h1>Your ticket</h1>
    <div id="qr"></div>
    <p id="msg">Show this at the door</p>
    <script>
        const code = new URLSearchParams(location.search).get("t");
        if (/^[0-9a-f-]{36}$/i.test(code || "")) {
            // SVG so the code stays sharp at any zoom
            const qr = qrcode(0, "M");
            qr.addData("https://mwalts.com/tickets/door/?t=" + code);
            qr.make();
            document.getElementById("qr").innerHTML = qr.createSvgTag({ margin: 0, scalable: true });
        } else {
            document.getElementById("qr").remove();
            document.getElementById("msg").textContent = "This ticket link looks broken. Check the link in your email";
        }
    </script>
</body>

</html>
